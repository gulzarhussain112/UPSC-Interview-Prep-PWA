name: Study Reminders

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: github-scheduler/package.json

      - name: Install dependencies
        working-directory: github-scheduler
        run: npm install

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/632920971695/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "firebase-adminsdk-fbsvc@interview-prep-upsc.iam.gserviceaccount.com"

      - name: Run reminder scheduler
        working-directory: github-scheduler
        run: node scheduler.js
